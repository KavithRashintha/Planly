        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'

  # ----------------- AI Assistant / Agent -----------------
  /agent/chat:
    post:
      summary: Send message to assistant and execute multi-turn loop
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '429':
          description: Daily message limit exceeded

  /agent/conversations:
    get:
      summary: List agent conversation sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    created_at:
                      type: string
                      format: date-time

  /agent/conversations/{id}:
    get:
      summary: Retrieve full conversation message history
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation detail with messages
    delete:
      summary: Delete conversation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Conversation deleted

  /agent/plan-goal:
    post:
      summary: Trigger dedicated plan-goal breakdown flow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanGoalRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'

  /agent/reschedule:
    post:
      summary: Trigger automatic rescheduling for overdue tasks
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'

  /agent/proposals:
    get:
      summary: List staged human-in-the-loop proposals
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentProposal'

  /agent/proposals/{id}/approve:
    post:
      summary: Approve proposal and execute planned actions against planner service
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProposal'
        '409':
          description: Proposal has already been decided

  /agent/proposals/{id}/reject:
    post:
      summary: Reject proposal without making any changes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProposal'
        '409':
          description: Proposal has already been decided

  /agent/runs/{id}:
    get:
